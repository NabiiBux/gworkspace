    <!-- Suppress third-party browser extension errors (e.g. MetaMask in sandboxed preview iframes) -->
    <script>
      (function() {
        function shouldIgnore(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || err.description || String(err))).toLowerCase();
          return msg.indexOf('metamask') !== -1 ||
                 msg.indexOf('failed to connect to metamask') !== -1 ||
                 msg.indexOf('extension context invalidated') !== -1 ||
                 msg.indexOf('chrome-extension://') !== -1 ||
                 msg.indexOf('moz-extension://') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && shouldIgnore(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && (shouldIgnore(event.message) || shouldIgnore(event.error))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
