# Nginx reverse proxy for portal.gnbmentor.com (frontend + API served by the same Node process).
# Copy to /etc/nginx/sites-available/gworkspace and symlink into sites-enabled.
# Run certbot afterwards — it adds the SSL server block automatically.

server {
    listen 80;
    server_name portal.gnbmentor.com;

    # Everything (React app, /api/*, Stripe/Nicky webhooks) proxies to the Node backend,
    # which serves the frontend build itself.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # bulk lookups / provisioning can take a while
        proxy_send_timeout 300s;
    }

    client_max_body_size 10m;
}
