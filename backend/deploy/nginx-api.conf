# Nginx reverse proxy for the backend API.
# 1) Replace api.gnbmentor.com with your real API subdomain.
# 2) Copy to /etc/nginx/sites-available/gworkspace-api and symlink into sites-enabled.
# 3) Run certbot afterwards — it will add the SSL server block automatically.

server {
    listen 80;
    server_name api.gnbmentor.com;

    # Stripe/Nicky webhooks + normal API traffic all proxy straight through.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # bulk lookups / provisioning can take a while
        proxy_send_timeout 300s;
    }

    client_max_body_size 10m;
}
